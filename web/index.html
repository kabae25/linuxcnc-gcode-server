<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinuxCNC Rotary Table Controller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --panel: #131c2e;
      --panel-border: #22314e;
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #38bdf8;
      --accent-muted: #0284c7;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem;
    }

    /* Top Container */
    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* Minimal Header */
    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
    }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .header-badges {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      background: #0b1322;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
    }

    .badge-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .badge-dot.offline {
      background: var(--danger);
    }

    .badge-dot.warning {
      background: var(--warning);
    }

    /* Top Control Bar: ENABLE, DISABLE, HOME, ABORT */
    .top-control-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 0.75rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel-header {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      border-bottom: 1px solid var(--panel-border);
      padding-bottom: 0.4rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Monospace Readout Cards */
    .readout-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .readout-cell {
      background: #0b1322;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 0.75rem 1rem;
    }

    .readout-label {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }

    .readout-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      margin-top: 0.2rem;
    }

    /* Offset Controls */
    .offset-box {
      background: #0b1322;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 0.65rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .offset-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }

    .offset-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    /* Speed / Feedrate Control Panel */
    .speed-panel {
      background: #0b1322;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .speed-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
    }

    .speed-presets {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .speed-btn {
      flex: 1;
      min-width: 70px;
      padding: 0.35rem 0.4rem;
      background: #131c2e;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .speed-btn.active {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: #ffffff;
    }

    .num-input {
      padding: 0.45rem 0.6rem;
      background: #060a12;
      border: 1px solid var(--panel-border);
      border-radius: 4px;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      width: 90px;
      text-align: center;
    }

    .num-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Control Grid */
    .preset-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
    }

    .btn {
      padding: 0.6rem 0.85rem;
      background: #1a263d;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      color: var(--text);
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover {
      background: #243452;
      border-color: var(--accent);
    }

    .btn:active {
      background: var(--accent-muted);
    }

    .btn-sm {
      padding: 0.35rem 0.6rem;
      font-size: 0.75rem;
    }

    .btn-lg {
      padding: 0.8rem 1rem;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--accent-muted);
      border-color: var(--accent);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-success {
      background: #15803d;
      border-color: var(--success);
      color: #ffffff;
    }

    .btn-success:hover {
      background: #166534;
    }

    .btn-danger {
      background: #991b1b;
      border-color: var(--danger);
      color: #ffffff;
    }

    .btn-danger:hover {
      background: #7f1d1d;
    }

    /* Jog Selectors */
    .step-bar {
      display: flex;
      background: #060a12;
      border: 1px solid var(--panel-border);
      border-radius: 6px;
      padding: 2px;
      gap: 2px;
    }

    .step-btn {
      flex: 1;
      text-align: center;
      padding: 0.4rem 0.2rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-radius: 4px;
    }

    .step-btn.active {
      background: var(--panel);
      color: var(--accent);
      font-weight: 700;
    }

    .jog-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
    }

    .jog-btn {
      height: 52px;
      font-size: 1.1rem;
      font-weight: 700;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- Header: Title + Controls + Live Status Badges -->
    <header>
      <div>
        <div class="header-title">LinuxCNC Rotary Table Controller</div>
      </div>
      <div class="header-right">
        <div class="header-controls">
          <button class="btn btn-sm btn-success" onclick="sendAction('/api/v1/enable')">ENABLE</button>
          <button class="btn btn-sm" onclick="sendAction('/api/v1/disable')">DISABLE</button>
          <button class="btn btn-sm btn-danger" onclick="sendAction('/api/v1/abort')">ABORT</button>
        </div>
        <div class="header-badges">
          <!-- Connection Status -->
          <div class="badge">
            <div id="statusDot" class="badge-dot"></div>
            <span id="statusText">Connected</span>
          </div>
        </div>
      </div>
    </header>

    <!-- Monospace Numeric Position Readout Panel -->
    <div class="panel">
      <div class="panel-header">Position Readout</div>

      <div class="readout-grid">
        <div class="readout-cell">
          <div class="readout-label"
            style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
            <span>POSITION (A-AXIS)</span>
            <!-- Homing Status Indicator -->
            <div id="homingBadge" class="badge" style="padding: 0.2rem 0.5rem; margin-left: 0.5rem;">
              <div id="homingDot" class="badge-dot warning"></div>
              <span id="homingText">NOT HOMED</span>
            </div>
          </div>
          <div id="actualPosReadout" class="readout-value">---</div>
        </div>
        <button class="btn btn-lg btn-primary" onclick="sendAction('/api/v1/home')">HOME</button>
      </div>

      <!-- Motion Speed / Feedrate Control Panel -->
      <div class="panel">
        <div class="panel-header" style="margin-top: 0.25rem;">Step Jogging</div>

        <div style="display: flex; flex-direction: column; gap: 0.5rem;">
          <div class="step-bar">
            <div class="step-btn" onclick="setStep(0.1, this)">0.1°</div>
            <div class="step-btn active" onclick="setStep(1.0, this)">1.0°</div>
            <div class="step-btn" onclick="setStep(10.0, this)">10.0°</div>
            <div class="step-btn" onclick="setStep(45.0, this)">45.0°</div>
            <div class="step-btn" onclick="setStep(90.0, this)">90.0°</div>
            <div class="step-btn" onclick="setStep(180.0, this)">180°</div>
            <div class="step-btn" onclick="setStep(360.0, this)">360°</div>
          </div>

          <div class="jog-row">
            <button class="btn jog-btn" onclick="jog(-1)">JOG CCW (-)</button>
            <button class="btn jog-btn" onclick="jog(1)">JOG CW (+)</button>
          </div>
        </div>
      </div>

      <div class="speed-panel">
        <div class="speed-top">
          <span>JOG & MOVE FEEDRATE (°/min)</span>
          <span id="feedrateValText" style="font-family: 'JetBrains Mono', monospace; color: var(--accent);">1200
            °/min</span>
        </div>
        <div class="speed-presets">
          <div class="speed-btn" onclick="setFeedrate(300, this)">300°/min</div>
          <div class="speed-btn" onclick="setFeedrate(600, this)">600°/min</div>
          <div class="speed-btn active" onclick="setFeedrate(1200, this)">1200°/min</div>
          <div class="speed-btn" onclick="setFeedrate(2400, this)">2400°/min</div>
          <div class="speed-btn" onclick="setFeedrate(3600, this)">3600°/min</div>
          <div class="speed-btn" onclick="setFeedrate(0, this)">RAPID (G0)</div>
        </div>
        <div style="display: flex; align-items: center; gap: 0.5rem; margin-top: 0.25rem;">
          <input id="speedSlider" type="range" min="60" max="3600" value="1200" step="60"
            style="flex: 1; accent-color: var(--accent);" oninput="updateFeedrateFromSlider(this.value)">
          <input id="speedInput" type="number" class="num-input" value="1200" min="0" max="10000" step="60"
            onchange="updateFeedrateFromInput(this.value)">
        </div>
      </div>
    </div>

    <!-- Controls Panel: Presets, Step Jog, Target Move -->
    <div class="panel">
      <div class="panel-header">Quick Angle Presets (-720° to +720°)</div>

      <div class="preset-grid">
        <button class="btn" onclick="moveToPreset(-720)">-720°</button>
        <button class="btn" onclick="moveToPreset(-360)">-360°</button>
        <button class="btn" onclick="moveToPreset(-180)">-180°</button>
        <button class="btn" onclick="moveToPreset(-90)">-90°</button>
        <button class="btn" onclick="moveToPreset(0)">0°</button>
        <button class="btn" onclick="moveToPreset(90)">90°</button>
        <button class="btn" onclick="moveToPreset(180)">180°</button>
        <button class="btn" onclick="moveToPreset(360)">360°</button>
        <button class="btn" onclick="moveToPreset(720)">720°</button>
      </div>



      <div class="panel-header" style="margin-top: 0.25rem;">Target Position Move</div>

      <div class="input-row">
        <input id="targetPosInput" type="number" min="-720" max="720" step="0.1" class="num-input"
          style="flex: 1; text-align: left; padding: 0.6rem 0.75rem;" placeholder="Target angle (-720° to +720°)">
        <button class="btn btn-primary" onclick="sendTargetMove()">GO MOVE</button>
      </div>
    </div>

  </div>

  <script>
    let currentStep = 1.0;
    let currentFeedrate = 1200; // 0 = Rapid G0, >0 = Feedrate F in °/min
    let savedOffset = localStorage.getItem('rotary_zero_offset');
    let zeroOffset = savedOffset !== null ? parseFloat(savedOffset) : -71.0;
    let lastRawPosition = 0.0;

    function initOffsetUI() {
      document.getElementById('offsetSlider').value = zeroOffset;
      document.getElementById('offsetInput').value = zeroOffset.toFixed(1);
      document.getElementById('offsetValText').innerText = `${zeroOffset >= 0 ? '+' : ''}${zeroOffset.toFixed(1)}°`;
    }

    function setStep(val, elem) {
      currentStep = val;
      document.querySelectorAll('.step-btn').forEach(el => el.classList.remove('active'));
      elem.classList.add('active');
    }

    function setFeedrate(val, elem) {
      currentFeedrate = val;
      document.querySelectorAll('.speed-btn').forEach(el => el.classList.remove('active'));
      if (elem) elem.classList.add('active');

      document.getElementById('speedInput').value = val;
      if (val > 0) {
        document.getElementById('speedSlider').value = val;
        document.getElementById('feedrateValText').innerText = `${val} °/min`;
      } else {
        document.getElementById('feedrateValText').innerText = `RAPID (G0)`;
      }
    }

    function updateFeedrateFromSlider(val) {
      setFeedrate(parseInt(val), null);
    }

    function updateFeedrateFromInput(val) {
      setFeedrate(parseInt(val) || 0, null);
    }

    function updateOffsetFromSlider(val) {
      zeroOffset = parseFloat(val);
      localStorage.setItem('rotary_zero_offset', zeroOffset);
      document.getElementById('offsetInput').value = zeroOffset.toFixed(1);
      document.getElementById('offsetValText').innerText = `${zeroOffset >= 0 ? '+' : ''}${zeroOffset.toFixed(1)}°`;
      updateReadouts(lastRawPosition);
    }

    function updateOffsetFromInput(val) {
      zeroOffset = parseFloat(val) || 0.0;
      localStorage.setItem('rotary_zero_offset', zeroOffset);
      document.getElementById('offsetSlider').value = zeroOffset;
      document.getElementById('offsetValText').innerText = `${zeroOffset >= 0 ? '+' : ''}${zeroOffset.toFixed(1)}°`;
      updateReadouts(lastRawPosition);
    }

    function setZeroOffsetHere() {
      zeroOffset = -lastRawPosition;
      updateOffsetFromInput(zeroOffset);
    }

    function resetOffset() {
      updateOffsetFromInput(0.0);
    }

    function updateReadouts(rawAngleDeg) {
      lastRawPosition = rawAngleDeg;
      const actualElem = document.getElementById('actualPosReadout');
      if (actualElem) {
        actualElem.innerText = `${rawAngleDeg.toFixed(2)}°`;
      }
      const displayElem = document.getElementById('displayPosReadout');
      if (displayElem) {
        let effectiveAngle = rawAngleDeg + zeroOffset;
        displayElem.innerText = `${effectiveAngle.toFixed(2)}°`;
      }
    }

    function updateHomingBadge(isHomed) {
      const homingDot = document.getElementById('homingDot');
      const homingText = document.getElementById('homingText');
      if (!homingDot || !homingText) return;
      if (isHomed) {
        homingDot.className = "badge-dot";
        homingText.innerText = "HOMED";
      } else {
        homingDot.className = "badge-dot warning";
        homingText.innerText = "NOT HOMED";
      }
    }

    let isPolling = false;

    async function fetchPosition() {
      if (isPolling) return;
      isPolling = true;
      try {
        const resp = await fetch('/api/v1/position');
        const data = await resp.json();
        if (data && data.ok) {
          if (typeof data.position_deg === 'number') {
            updateReadouts(data.position_deg);
          }
          if (typeof data.homed !== 'undefined') {
            updateHomingBadge(Boolean(data.homed));
          }
          const statusDot = document.getElementById('statusDot');
          const statusText = document.getElementById('statusText');
          if (statusDot) statusDot.className = "badge-dot";
          if (statusText) statusText.innerText = 'Connected';
        } else {
          const statusDot = document.getElementById('statusDot');
          const statusText = document.getElementById('statusText');
          if (statusDot) statusDot.className = "badge-dot offline";
          if (statusText) statusText.innerText = (data && data.error) ? data.error : 'Disconnected';
        }
      } catch (e) {
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        if (statusDot) statusDot.className = "badge-dot offline";
        if (statusText) statusText.innerText = 'Offline';
      } finally {
        isPolling = false;
      }
    }

    async function sendAction(url, payload = {}) {
      try {
        const resp = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        await resp.json();
      } catch (err) {
        console.error("Action error:", err);
      } finally {
        setTimeout(fetchPosition, 50);
      }
    }

    function moveToPreset(angle) {
      const val = parseFloat(angle);
      let payload = { preset_deg: val };
      if (currentFeedrate > 0) payload.feedrate = parseFloat(currentFeedrate);
      sendAction('/api/v1/preset', payload);
    }

    function jog(dir) {
      const direction = parseInt(dir);
      const step = parseFloat(currentStep);
      let payload = { direction: direction, step: step };
      if (currentFeedrate > 0) payload.feedrate = parseFloat(currentFeedrate);
      sendAction('/api/v1/jog', payload);
    }

    function sendTargetMove() {
      const val = parseFloat(document.getElementById('targetPosInput').value);
      if (!isNaN(val)) {
        if (val < -720 || val > 720) {
          alert("Target angle must be between -720° and +720°.");
          return;
        }
        let payload = { position: val, mode: 'absolute' };
        if (currentFeedrate > 0) payload.feedrate = currentFeedrate;
        sendAction('/api/v1/move', payload);
      }
    }

    // Init
    initOffsetUI();
    fetchPosition();
    setInterval(() => {
      if (!isPolling) fetchPosition();
    }, 100);
  </script>
</body>

</html>
